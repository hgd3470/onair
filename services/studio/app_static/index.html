<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온에어</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="온에어">
<meta name="format-detection" content="telephone=no">
<!-- 로그인 쿠키 뒤에서 열리므로 manifest도 쿠키를 실어 받는다 -->
<link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div id="app" class="app">
  <main id="views" class="views">

    <!-- 듣기: 시간 고르기 / 재생 화면 -->
    <section id="tab-listen" class="tab" aria-label="듣기">
      <div id="view-home" class="home">
        <h1 class="wordmark">온에어</h1>
        <div class="home-main">
          <p id="home-note" class="home-note" hidden></p>
          <button id="resume" class="resume" type="button" hidden>
            <span class="resume-label">이어서 듣기</span>
            <span id="resume-title" class="resume-title"></span>
          </button>
          <h2 id="home-heading" class="ask">얼마나 들으실래요?</h2>
          <div class="presets" role="group" aria-labelledby="home-heading">
            <button class="preset" type="button" data-minutes="5"><span class="num">5</span><span class="unit">분</span></button>
            <button class="preset" type="button" data-minutes="10"><span class="num">10</span><span class="unit">분</span></button>
            <button class="preset" type="button" data-minutes="20"><span class="num">20</span><span class="unit">분</span></button>
            <button class="preset" type="button" data-minutes="30"><span class="num">30</span><span class="unit">분</span></button>
          </div>
          <button id="home-interests" class="row-btn" type="button">
            <span class="row-label">관심사</span>
            <span id="home-interests-value" class="row-value">전체</span>
          </button>
        </div>
      </div>

      <div id="view-player" class="player" data-state="idle" hidden>
        <div class="p-top">
          <p id="p-count" class="p-count"></p>
          <button id="p-stop" class="btn-quiet" type="button" aria-haspopup="dialog">끝내기</button>
        </div>
        <!-- 제목과 출처는 늘었다 줄었다 하는 칸에 두고, 아래 조작부는 항상 같은 자리에 둔다 -->
        <div class="p-body">
          <div class="p-head">
            <h2 id="p-title" class="p-title"></h2>
            <p id="p-meta" class="p-meta"></p>
            <p id="p-note" class="p-note" hidden>광고가 끝나면 다음 이야기로 넘어갑니다</p>
          </div>
          <div id="p-source" class="source" hidden>
            <h3 class="source-h">출처</h3>
            <p id="src-attr" class="src-attr"></p>
            <div class="src-row">
              <span id="src-license" class="src-license"></span>
              <a id="src-link" class="src-link" target="_blank" rel="noopener noreferrer"></a>
            </div>
          </div>
        </div>
        <div class="p-progress">
          <div class="bar" id="p-bar" role="progressbar" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="p-fill"></i></div>
          <div class="times"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div>
        </div>
        <div class="controls">
          <button id="btn-prev" class="ctl" type="button" aria-label="이전 이야기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M19 6v12l-9-6z"/><rect class="solid" x="5.4" y="5.5" width="2.6" height="13" rx="1.1"/></svg>
          </button>
          <button id="btn-play" class="ctl ctl-main" type="button" aria-label="재생">
            <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M8.5 5.6v12.8l10.5-6.4z"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect class="solid" x="6.2" y="5" width="4.2" height="14" rx="1.2"/><rect class="solid" x="13.6" y="5" width="4.2" height="14" rx="1.2"/></svg>
          </button>
          <button id="btn-next" class="ctl" type="button" aria-label="다음 이야기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M5 6v12l9-6z"/><rect class="solid" x="16" y="5.5" width="2.6" height="13" rx="1.1"/></svg>
          </button>
        </div>
        <div class="p-actions">
          <button id="btn-back10" class="act" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4.5v3.8h3.8"/></svg>
            <span>10초 뒤로</span>
          </button>
          <button id="btn-like" class="act act-like" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.2-4.5-7.2-9.7A4.1 4.1 0 0 1 12 7.9a4.1 4.1 0 0 1 7.2 2.4C19.2 15.5 12 20 12 20z"/></svg>
            <span>좋아요</span>
          </button>
        </div>
        <p id="p-next" class="p-next"></p>
      </div>
    </section>

    <!-- 대담: 두 사람 롱폼 (talk.js) -->
    <section id="tab-talk" class="tab" aria-label="대담" hidden>
      <h2 class="page-title">대담</h2>
      <p class="tk-intro">두 사람이 근거를 들고 이야기합니다. 줄마다 어디서 나온 말인지 볼 수 있어요.</p>
      <div id="talk-body"></div>
    </section>

    <!-- 관심사 -->
    <section id="tab-interests" class="tab" aria-label="관심사" hidden>
      <h2 class="page-title">관심사</h2>
      <div id="topics" class="topics"></div>
      <!-- 듣는 중에 관심사를 바꾸면 나타난다 -->
      <div id="rebuild" class="rebuild" role="status" hidden>
        <p class="rebuild-text">저장했습니다. 바꾼 관심사는 다음 목록부터 들어갑니다.</p>
        <button id="rebuild-go" class="rebuild-go" type="button">지금 목록 다시 만들기</button>
      </div>
    </section>

    <!-- 목록 / 들은 기록 -->
    <section id="tab-list" class="tab" aria-label="목록" hidden>
      <h2 class="page-title">목록</h2>
      <div class="seg" role="tablist" aria-label="목록 고르기">
        <button id="seg-all" type="button" role="tab" data-mode="all" aria-selected="true"><span>전체</span><span class="seg-n"></span></button>
        <button id="seg-new" type="button" role="tab" data-mode="new" aria-selected="false"><span>새 이야기</span><span class="seg-n"></span></button>
        <button id="seg-unheard" type="button" role="tab" data-mode="unheard" aria-selected="false"><span>안 들은 것</span><span class="seg-n"></span></button>
        <button id="seg-history" type="button" role="tab" data-mode="history" aria-selected="false"><span>들은 기록</span><span class="seg-n"></span></button>
      </div>
      <ul id="list" class="list"></ul>
      <p id="list-empty" class="empty" hidden></p>
    </section>
  </main>

  <!-- 알림은 작은 재생 줄(없으면 탭) 바로 위에 뜬다 -->
  <div class="toast-anchor">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- 다른 탭에 있을 때 보이는 작은 재생 줄 -->
  <div id="mini" class="mini" hidden>
    <button id="mini-open" class="mini-open" type="button">
      <span id="mini-title" class="mini-title"></span>
      <span id="mini-meta" class="mini-meta"></span>
    </button>
    <button id="mini-play" class="mini-play" type="button" aria-label="재생">
      <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M8.5 5.6v12.8l10.5-6.4z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect class="solid" x="6.2" y="5" width="4.2" height="14" rx="1.2"/><rect class="solid" x="13.6" y="5" width="4.2" height="14" rx="1.2"/></svg>
    </button>
  </div>

  <nav class="tabbar" aria-label="화면">
    <button class="tabbtn" type="button" data-tab="listen" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 6.5v11M12 9v6M16 4.5v15M20 10v4"/></svg>
      <span>듣기</span>
    </button>
    <button class="tabbtn" type="button" data-tab="talk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h10a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H9l-3.5 3v-3H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z"/><path d="M18 9.5h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1.5v3l-3.5-3H12"/></svg>
      <span>대담</span>
    </button>
    <button class="tabbtn" type="button" data-tab="interests">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span>관심사</span>
    </button>
    <button class="tabbtn" type="button" data-tab="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></svg>
      <span>목록</span>
    </button>
  </nav>

  <!-- 끝내기 전에 한 번 묻는다 -->
  <div id="sheet" class="sheet" hidden>
    <div id="sheet-scrim" class="sheet-scrim"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-describedby="sheet-desc">
      <h2 id="sheet-title" class="sheet-title">듣기를 끝낼까요?</h2>
      <p id="sheet-desc" class="sheet-desc">지금 목록은 지워지고, 들은 기록은 남습니다.</p>
      <div class="sheet-btns">
        <button id="sheet-ok" class="sheet-btn sheet-ok" type="button">끝내기</button>
        <button id="sheet-cancel" class="sheet-btn" type="button">계속 듣기</button>
      </div>
    </div>
  </div>

  <!-- 음원은 이 요소 하나로만 튼다 (iOS는 같은 요소에서만 이어 재생을 허용한다) -->
  <audio id="audio" preload="auto"></audio>
</div>
<noscript>이 화면은 자바스크립트가 켜져 있어야 열립니다.</noscript>
<script src="./app.js"></script>
<script src="./talk.js"></script>
</body>
</html>
