[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "source-collector"
version = "0.1.0"
description = "Source Collection & Headless LLM-as-a-Judge Harness for Hyundai Pleos Audio Short-form Script Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
source-collector = "source_collector.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
