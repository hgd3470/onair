[project]
name = "s2-05-script-agent"
version = "0.1.0"
description = "Source-grounded Korean audio script generation and handoff"
authors = [{name = "S2-05"}]
requires-python = ">=3.11,<4.0"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "pyyaml>=6.0,<7",
  "filelock>=3.20,<5",
  "google-auth[requests]>=2.0,<3",
]

[tool.poetry]
packages = [{include = "script_agent", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10"

[project.scripts]
script-agent = "script_agent.cli:main"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
